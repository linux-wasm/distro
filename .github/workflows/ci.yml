# Build the pinned kernel and boot it headless.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: scripts/build.sh

      - name: Boot test
        run: scripts/test.sh

      - uses: actions/upload-artifact@v4
        with:
          name: vmlinux-wasm
          path: work/build/kernel/vmlinux.wasm
