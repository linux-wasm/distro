<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Linux on WebAssembly</title>
    <meta
      name="description"
      content="The Linux kernel, compiled to WebAssembly, booting in this browser tab."
    />
    <link rel="stylesheet" href="xterm.css" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        background: #111;
        color: #ddd;
        font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 0.25em 1em;
        align-items: baseline;
        padding: 0.5em 1em;
        background: #1c1c1c;
        border-bottom: 1px solid #333;
      }
      header h1 {
        margin: 0;
        font-size: 14px;
      }
      header a {
        color: #8ab4f8;
      }
      #status {
        color: #8a8;
      }
      header .links {
        margin-left: auto;
        display: flex;
        gap: 1em;
      }
      header button {
        font: inherit;
        color: #8ab4f8;
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
        text-decoration: underline;
      }
      #terminal {
        flex: 1;
        min-height: 0;
        padding: 0.5em;
      }
      #notes {
        margin: 0;
        padding: 0 1em;
        max-height: 30%;
        overflow: auto;
        white-space: pre-wrap;
        color: #68a;
      }
      #notes .error {
        color: #e66;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Linux on WebAssembly</h1>
      <span id="status">starting</span>
      <span class="links">
        <button id="reset" title="Delete the stored changes to the file system and start again from the base">reset disk</button>
        <a id="build" href="https://github.com/linux-wasm/linux"></a>
        <a href="https://github.com/linux-wasm">source</a>
      </span>
    </header>
    <div id="terminal" aria-label="Console"></div>
    <pre id="notes" aria-label="Messages of the page itself"></pre>
    <script src="xterm.js"></script>
    <script src="addon-fit.js"></script>
    <script src="addon-webgl.js"></script>
    <script type="module" src="boot.js"></script>
  </body>
</html>
